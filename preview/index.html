<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ConnectV — UI preview (v1.2.0)</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;700;800&family=Manrope:wght@400;500;600;700&display=swap"
    />
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background:
          linear-gradient(135deg, #eef2f7 0%, #f7f8fa 48%, #e8eef8 100%);
        font-family: Manrope, system-ui, sans-serif;
      }
      .stage {
        min-height: 100vh;
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(360px, 30vw);
      }
      .mock-mail {
        padding: 48px 56px;
        color: #5c6775;
      }
      .mock-mail h2 {
        margin: 0 0 8px;
        font-family: 'Bricolage Grotesque', Georgia, serif;
        font-size: 28px;
        color: #1c2430;
      }
      .mock-mail p {
        margin: 0;
        max-width: 420px;
        line-height: 1.5;
      }
      .badge {
        display: inline-block;
        margin-top: 16px;
        padding: 6px 10px;
        border-radius: 999px;
        background: rgba(37, 99, 235, 0.12);
        color: #2563eb;
        font-size: 12px;
        font-weight: 700;
      }
      #cvlist-host {
        position: relative;
        height: 100vh;
        border-left: 1px solid rgba(28, 36, 48, 0.1);
        background: #fff;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="mock-mail">
        <h2>Private Email (preview)</h2>
        <p>
          This is a local preview of the ConnectV side panel after the v1.2.0 update, including the
          new <strong>From alias</strong> selector on the Main tab.
        </p>
        <span class="badge">manifest version 1.5.1</span>
      </div>
      <div id="cvlist-host"></div>
    </div>
    <script>
      const LOGO =
        '<svg viewBox="0 0 24 24" fill="none"><path d="M12 2.6 20.5 7v10L12 21.4 3.5 17V7L12 2.6Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M8.6 12.3l2.4 2.4 4.6-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

      const host = document.getElementById('cvlist-host');
      const root = host.attachShadow({ mode: 'open' });

      async function boot() {
        const css = await fetch('../src/content/panel-ui.css').then((r) => r.text());
        const style = document.createElement('style');
        style.textContent =
          css +
          `
          :host { display:block; height:100%; }
          .app {
            position: absolute !important;
            inset: 0 !important;
            width: 100% !important;
            min-width: 0 !important;
            height: 100% !important;
            box-shadow: none !important;
            border-left: none !important;
          }
        `;

        root.innerHTML = `
          <div class="app" id="shell">
            <div class="atmosphere" aria-hidden="true">
              <span class="orb orb-a"></span>
              <span class="orb orb-b"></span>
              <span class="grain"></span>
            </div>
            <div class="hdr">
              <div class="brand">
                <div class="mark">${LOGO}</div>
                <div class="brand-txt">
                  <h1>Connect<span>V</span></h1>
                  <p>List send</p>
                </div>
              </div>
              <div class="hdr-actions">
                <button type="button" class="icon-btn" title="Hide panel">›</button>
              </div>
            </div>
            <div class="tabs">
              <button type="button" class="tab tab-mail is-active" data-page="mail">Mail</button>
              <button type="button" class="tab" data-page="main">Main</button>
              <button type="button" class="tab" data-page="templates">Templates</button>
            </div>
            <div class="body">
              <div class="page">
                <div class="meta-bar mail-meta">
                  <div class="meta-side mail-identity">
                    <span class="gmail-chip" title="you@yourdomain.com">
                      <span class="gmail-chip-kicker">Private Email</span>
                      <span class="gmail-chip-addr">you@yourdomain.com</span>
                    </span>
                  </div>
                </div>
                <div class="scroll">
                  <div class="mail-page">
                    <h3 class="section-label">Private Email sender</h3>
                    <p class="mail-page-copy">
                      Select one or more aliases. Each message is sent from a random selected alias.
                    </p>
                    <div class="toolbar">
                      <button type="button" class="primary">Reload aliases (4)</button>
                    </div>
                    <div class="alias-bar">
                      <div class="alias-bar-head">
                        <span class="alias-label">From aliases</span>
                        <span class="alias-count">3 selected · 4 loaded</span>
                      </div>
                      <div class="alias-actions">
                        <button type="button" class="secondary">Select all</button>
                        <button type="button" class="secondary">Clear</button>
                      </div>
                      <div class="alias-chip-grid">
                        <button type="button" class="alias-chip is-on">sales@yourdomain.com</button>
                        <button type="button" class="alias-chip is-on">support@yourdomain.com</button>
                        <button type="button" class="alias-chip is-on">hello@yourdomain.com</button>
                        <button type="button" class="alias-chip">billing@yourdomain.com</button>
                      </div>
                    </div>
                    <div class="mail-selected">
                      <span class="mail-selected-kicker">Selected From pool</span>
                      <span class="mail-selected-addr">3 aliases (random per send)</span>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        `;
        root.prepend(style);
      }

      void boot();
    </script>
  </body>
</html>
